<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Data Mahasiswa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Decoration -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <h1>Sistem Manajemen Mahasiswa</h1>
            </div>
            <button id="themeToggle" class="icon-btn theme-toggle" title="Toggle Tema">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
        </header>

        <main class="app-content">
            <!-- Form Section -->
            <section class="card form-section glass">
                <h2 id="formTitle">Tambah Data Mahasiswa</h2>
                <form id="studentForm">
                    <input type="hidden" id="editIndex" value="">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
                        </div>
                        <div class="form-group">
                            <label for="nim">NIM</label>
                            <input type="number" id="nim" placeholder="Masukkan NIM (Angka)" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat</label>
                        <textarea id="alamat" rows="2" placeholder="Masukkan alamat domisili" required></textarea>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="jk">Jenis Kelamin</label>
                            <div class="custom-select-wrapper">
                                <select id="jk" required>
                                    <option value="" disabled selected>Pilih Jenis Kelamin</option>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-input">
                                <input type="password" id="password" placeholder="Masukkan password" required>
                                <button type="button" id="togglePassword" class="icon-btn pass-toggle" tabindex="-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Batal Edit</button>
                        <button type="submit" id="submitBtn" class="btn btn-primary">Simpan Data</button>
                    </div>
                </form>
            </section>

            <!-- Table Section -->
            <section class="card table-section glass">
                <div class="table-header">
                    <h2>Daftar Mahasiswa</h2>
                    
                    <div class="table-controls">
                        <div class="search-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="text" id="searchInput" placeholder="Cari Nama atau NIM...">
                        </div>
                        
                        <div class="controls-actions">
                            <div class="sort-box">
                                <select id="sortSelect" class="btn-select">
                                    <option value="terbaru">Urutkan: Terbaru</option>
                                    <option value="nama_asc">Nama (A-Z)</option>
                                    <option value="nama_desc">Nama (Z-A)</option>
                                    <option value="nim_asc">NIM (Kecil-Besar)</option>
                                </select>
                            </div>
                            
                            <button id="exportExcelBtn" class="btn btn-export" title="Export ke Excel">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                                <span>Export</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table id="studentTable">
                        <thead>
                            <tr>
                                <th width="5%">No</th>
                                <th width="20%">NIM</th>
                                <th width="35%">Nama Lengkap</th>
                                <th width="20%">Jenis Kelamin</th>
                                <th width="20%" class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Data baris tabel dirender melalui JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-container">
                    <div class="page-info" id="pageInfo">Menampilkan 0 data</div>
                    <div class="pagination" id="pagination">
                        <!-- Tombol page dirender melalui JS -->
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Toast Notification -->
        <div id="toast" class="toast">
            <svg class="toast-icon success-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span id="toastMessage">Pesan Notifikasi</span>
        </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
